name: Build and Test

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  # Bit-rot nöbetçisi: -DREJI_VULKAN_MOCK=ON derlemesi ayrı bir kapı.
  # Mock'u hiçbir test tam derlemediği için çürümesi fark edilmiyordu
  # (copy_optimizer C1083, TALIMAT_CI_CPP_BUILD_ONARIMI Parça 3) — Clippy
  # kapısıyla aynı mantık: kullanılmayan mekanizma her koşumda derlenerek
  # canlı tutulur. Yalnız reji_pipeline hedefi: statik lib → link yok →
  # Vulkan SDK, Zig ve Rust gerektirmez (~en ucuz gerçek kapı).
  # Runner'da Qt yok → reji_ui stub; UI tarafının mock derlemesi yerel
  # tam-mock build ile doğrulanır.
  mock-build:
    name: Mock Build (bit-rot nöbetçisi)
    runs-on: windows-latest
    steps:
      - name: Kodu indir
        uses: actions/checkout@v4

      - name: MSVC ortamını ayarla
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: CMake yapılandır (mock)
        run: cmake -B build_mock -G "NMake Makefiles" -DCMAKE_BUILD_TYPE=Release -DREJI_VULKAN_MOCK=ON

      - name: Mock derle (reji_pipeline)
        run: cmake --build build_mock --target reji_pipeline

  build-windows:
    name: Windows Build
    runs-on: windows-latest
    env:
      RJ_ENABLE_VULKAN_VALIDATION: "1"

    steps:
      - name: Kodu indir
        uses: actions/checkout@v4

      - name: Rust kur
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: Swatinem/rust-cache@v2

      - name: MSVC ortamını ayarla
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      # Vulkan SDK: yalnız Headers + Loader, Khronos kaynağından (~1 dk, ~20 MB).
      # Tam SDK gereksiz — link ediyoruz, çalıştırmıyoruz (GPU sürücüsü yok).
      # Sürüm yerelde çalışanla sabit (C:\VulkanSDK\1.4.350.0).
      - name: Vulkan SDK kur (headers + loader)
        uses: humbletim/setup-vulkan-sdk@v1.2.1
        with:
          vulkan-query-version: 1.4.350.0
          vulkan-components: Vulkan-Headers, Vulkan-Loader
          vulkan-use-cache: true

      - name: Build Rust orchestrator
        run: cargo build --release --verbose 2>&1
        working-directory: ${{ github.workspace }}

      - name: Verify Rust lib exists
        run: |
          if (!(Test-Path "target/release/reji_orchestrator.lib")) {
            Write-Host "ERROR: reji_orchestrator.lib not found!"
            Get-ChildItem target/release/ -ErrorAction SilentlyContinue
            exit 1
          }
          Write-Host "OK: reji_orchestrator.lib found"
        shell: pwsh

      # Zig katmanı: reji_pipeline ve test hedefleri zig-out/lib/*.lib'e link
      # eder (reji_ffi, vulkan_init_zig, ext_bridge_zig, rtmp_transport_zig).
      # zig-out git'te takipli değil — her koşumda derlenir. Sürüm yerelde
      # çalışanla sabit (zig version = 0.16.0). gpu/ext-bridge hedefleri
      # Vulkan SDK başlıklarını ister → SDK adımından sonra koşmalı.
      - name: Zig kur
        uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0

      - name: Zig lib'leri derle
        # pwsh ara komutun exit kodunu yutar — her hedef sonrası açık kapı.
        run: |
          zig build ffi; if ($LASTEXITCODE) { exit $LASTEXITCODE }
          zig build gpu -Dvulkan-sdk="$env:VULKAN_SDK"; if ($LASTEXITCODE) { exit $LASTEXITCODE }
          zig build ext-bridge -Dvulkan-sdk="$env:VULKAN_SDK"; if ($LASTEXITCODE) { exit $LASTEXITCODE }
          zig build rtmp; if ($LASTEXITCODE) { exit $LASTEXITCODE }
        shell: pwsh

      - name: Install Google Test
        run: |
          git clone https://github.com/google/googletest.git
          cd googletest
          cmake -B build -G "NMake Makefiles" -DCMAKE_BUILD_TYPE=Release
          cmake --build build
          cmake --install build --prefix C:/gtest
        shell: cmd

      - name: CMake yapılandır
        run: cmake -B build -G "NMake Makefiles" -DCMAKE_BUILD_TYPE=Release -DGTEST_ROOT=C:/gtest -DRJ_VALIDATION=ON

      - name: C++ derle
        run: cmake --build build

      - name: FFI sınır testini çalıştır
        run: build\tests\test_ffi_boundary.exe

      - name: Rust testleri çalıştır
        run: cargo test

      - name: Validate Vulkan (headless)
        run: |
          set RJ_ENABLE_VULKAN_VALIDATION=1
          build\src\ui\reji_app.exe --headless --frames 10 2> vk_log.txt
          findstr "VUID" vk_log.txt && exit 1 || exit 0
        shell: cmd